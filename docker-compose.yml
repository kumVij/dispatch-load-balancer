services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dispatchdb
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatchdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/dispatchdb
      DB_USER: dispatch
      DB_PASSWORD: dispatch
    ports:
      - "8080:8080"

volumes:
  pgdata:
