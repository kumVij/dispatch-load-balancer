# Render Blueprint: New + > Blueprint > pick this repo
services:
  - type: web
    name: dispatch-load-balancer
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k"
